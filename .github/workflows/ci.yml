name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest / Release
            os: ubuntu-latest
            run-crash-recovery: true
            remaining-filter: >-
              FullyQualifiedName!~PantsCloudCrashRecoveryTests&
              FullyQualifiedName!~PantsTransactionSpillCrashRecoveryTests&
              FullyQualifiedName!~PantsCommitCoalescingCrashRecoveryTests
            max-parallel-threads: 8
          - name: macos-latest / Release
            os: macos-latest
            run-crash-recovery: true
            remaining-filter: >-
              FullyQualifiedName!~PantsCloudCrashRecoveryTests&
              FullyQualifiedName!~PantsTransactionSpillCrashRecoveryTests&
              FullyQualifiedName!~PantsCommitCoalescingCrashRecoveryTests
            max-parallel-threads: 8
          - name: windows-latest / Release
            os: windows-latest
            run-crash-recovery: false
            remaining-filter: >-
              FullyQualifiedName!~PantsCloudCrashRecoveryTests&
              FullyQualifiedName!~PantsTransactionSpillCrashRecoveryTests&
              FullyQualifiedName!~PantsCommitCoalescingCrashRecoveryTests&
              FullyQualifiedName!~PantsBackgroundFlushPipelineTests&
              FullyQualifiedName!~PantsStorageVerificationHardeningTests&
              FullyQualifiedName!~PantsColumnFamilyReclamationTests&
              FullyQualifiedName!~RuntimeWorkerTests&
              FullyQualifiedName!~Cloud&
              FullyQualifiedName!~PantsHybrid&
              FullyQualifiedName!~PantsMemoryManagementContractTests&
              FullyQualifiedName!~PantsDurabilityParityTests&
              FullyQualifiedName!~PantsReadAmplificationContractTests&
              FullyQualifiedName!~PantsLeveledCompactionTests&
              FullyQualifiedName!~PantsCompressionCompatibilityTests&
              FullyQualifiedName!~PantsTransactionSpillReadMemoryTests&
              FullyQualifiedName!~PantsTransactionSpillBehaviorTests
            max-parallel-threads: 2
          - name: windows-latest / Release (cloud and storage)
            os: windows-latest
            run-crash-recovery: false
            remaining-filter: >-
              (FullyQualifiedName~Cloud|
              FullyQualifiedName~PantsHybrid|
              FullyQualifiedName~PantsMemoryManagementContractTests|
              FullyQualifiedName~PantsDurabilityParityTests|
              FullyQualifiedName~PantsReadAmplificationContractTests|
              FullyQualifiedName~PantsLeveledCompactionTests|
              FullyQualifiedName~PantsCompressionCompatibilityTests|
              FullyQualifiedName~PantsTransactionSpillReadMemoryTests|
              FullyQualifiedName~PantsTransactionSpillBehaviorTests)&
              FullyQualifiedName!~PantsCloudCrashRecoveryTests&
              FullyQualifiedName!~PantsBackgroundFlushPipelineTests&
              FullyQualifiedName!~PantsStorageVerificationHardeningTests&
              FullyQualifiedName!~PantsColumnFamilyReclamationTests&
              FullyQualifiedName!~RuntimeWorkerTests
            max-parallel-threads: 2
          - name: windows-latest / Release (runtime races)
            os: windows-latest
            run-crash-recovery: true
            remaining-filter: >-
              FullyQualifiedName~PantsBackgroundFlushPipelineTests|
              FullyQualifiedName~PantsStorageVerificationHardeningTests|
              FullyQualifiedName~PantsColumnFamilyReclamationTests|
              FullyQualifiedName~RuntimeWorkerTests
            max-parallel-threads: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Pants.slnx --locked-mode

      - name: Verify formatting and analyzers
        run: dotnet format Pants.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pants.slnx --configuration Release --no-restore

      - name: Test crash recovery
        if: ${{ matrix.run-crash-recovery }}
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~PantsCloudCrashRecoveryTests|FullyQualifiedName~PantsTransactionSpillCrashRecoveryTests|FullyQualifiedName~PantsCommitCoalescingCrashRecoveryTests"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=crash.trx"
          --results-directory TestResults
          --blame-hang-timeout 2m
          --blame-hang-dump-type none

      - name: Test remaining suite
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build
          --filter "${{ matrix.remaining-filter }}"
          --logger "trx;LogFileName=remaining.trx"
          --results-directory TestResults
          --blame-hang-timeout 3m
          --blame-hang-dump-type none
          --
          xUnit.MaxParallelThreads=${{ matrix.max-parallel-threads }}
          xUnit.ParallelAlgorithm=conservative

      - name: Report slowest tests
        if: ${{ always() }}
        shell: pwsh
        run: |
          $resultPaths = @(
            Join-Path $PWD "TestResults/crash.trx"
            Join-Path $PWD "TestResults/remaining.trx"
          ) | Where-Object { Test-Path $_ }
          if ($resultPaths.Count -eq 0) {
            Write-Warning "No TRX test result was produced."
            exit 0
          }

          $results = foreach ($resultPath in $resultPaths) {
            Select-Xml `
              -Path $resultPath `
              -XPath "//*[local-name()='UnitTestResult']" |
              ForEach-Object { $_.Node }
          }
          $results |
            Sort-Object { [TimeSpan]::Parse($_.duration) } -Descending |
            Select-Object -First 25 |
            ForEach-Object {
              Write-Host ("{0,12}  {1,-10}  {2}" -f $_.duration, $_.outcome, $_.testName)
            }
