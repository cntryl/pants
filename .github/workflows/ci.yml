name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore Pants.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Pants.slnx --verify-no-changes --no-restore

      - name: Start Sqrzl emulator
        if: matrix.os == 'ubuntu-latest'
        run: docker compose up --detach --wait sqrzl

      - name: Build
        run: dotnet build Pants.slnx --configuration Release --no-restore

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build

      - name: Test without Sqrzl
        if: matrix.os != 'ubuntu-latest'
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build
          --filter "Category!=Sqrzl"
          --blame-hang-timeout 4m
          --blame-hang-dump-type mini
          --logger "console;verbosity=normal"

      - name: Stop Sqrzl emulator
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: docker compose down --volumes
