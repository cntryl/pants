name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: dotnet format Pants.slnx --verify-no-changes

      - name: Build
        run: dotnet build Pants.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build
          --filter "Category!=Sqrzl"

  cloud-compatibility:
    name: Sqrzl cloud providers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Build
        run: dotnet build Pants.slnx --configuration Release

      - name: Test cloud compatibility
        run: >-
          dotnet test test/Pants.Tests/Pants.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=Sqrzl"
          --logger "console;verbosity=detailed"

      - name: Stop Sqrzl emulator
        if: ${{ always() }}
        run: docker compose down --volumes
