name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUD_FILTER: FullyQualifiedName~Cntryl.Pants.Cloud.
  COMPATIBILITY_FILTER: FullyQualifiedName~Cntryl.Pants.Compatibility.
  STORAGE_FILTER: FullyQualifiedName~Cntryl.Pants.Storage.
  CONTRACTS_FILTER: FullyQualifiedName~Cntryl.Pants.Contracts.|FullyQualifiedName~Cntryl.Pants.Transactions.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore Pants.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Pants.slnx --verify-no-changes --no-restore

  test:
    name: ${{ matrix.os }} (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        shard:
          - cloud
          - compatibility
          - storage
          - contracts
          - rest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore Pants.slnx --locked-mode

      - name: Start Sqrzl emulator
        if: matrix.os == 'ubuntu-latest'
        run: docker compose up --detach --wait sqrzl

      - name: Build
        run: dotnet build Pants.slnx --configuration Release --no-restore

      - name: Select shard filter
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          WITH_SQRZL: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          case "$SHARD" in
            cloud) filter="$CLOUD_FILTER" ;;
            compatibility) filter="$COMPATIBILITY_FILTER" ;;
            storage) filter="$STORAGE_FILTER" ;;
            contracts) filter="$CONTRACTS_FILTER" ;;
            rest)
              filter=""
              for f in "$CLOUD_FILTER" "$COMPATIBILITY_FILTER" "$STORAGE_FILTER" "$CONTRACTS_FILTER"; do
                IFS='|' read -ra parts <<< "$f"
                for p in "${parts[@]}"; do
                  filter="${filter:+$filter&}${p/\~/!~}"
                done
              done
              ;;
            *) echo "Unknown shard $SHARD" >&2; exit 1 ;;
          esac
          filter="($filter)"
          if [ "$WITH_SQRZL" != "true" ]; then
            filter="$filter&Category!=Sqrzl"
          fi
          echo "TEST_FILTER=$filter" >> "$GITHUB_ENV"
          echo "Shard filter: $filter"

      - name: Test
        run: >-
          dotnet test Pants.slnx
          --configuration Release
          --no-build
          --filter "${{ env.TEST_FILTER }}"
          --blame-hang-timeout 4m
          --blame-hang-dump-type mini
          --logger "console;verbosity=normal"

      - name: Stop Sqrzl emulator
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: docker compose down --volumes

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - format
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "format=$FORMAT_RESULT test=$TEST_RESULT"
          [ "$FORMAT_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]
