name: Compatibility qualification

on:
  pull_request:
    paths:
      - .editorconfig
      - .gitattributes
      - .github/workflows/compatibility-qualification.yml
      - Directory.Build.props
      - Directory.Packages.props
      - eng/compat/**
      - src/**
      - test/Pants.Tests/Fixtures/Compatibility/**
      - test/Pants.Tests/Compatibility*.cs
      - test/Pants.Tests/Midge*.cs
      - test/Pants.Tests/MidgeContractManifest.json
      - test/Pants.Tests/Pants.Tests.csproj
  push:
    branches:
      - main
    paths:
      - .editorconfig
      - .gitattributes
      - .github/workflows/compatibility-qualification.yml
      - Directory.Build.props
      - Directory.Packages.props
      - eng/compat/**
      - src/**
      - test/Pants.Tests/Fixtures/Compatibility/**
      - test/Pants.Tests/Compatibility*.cs
      - test/Pants.Tests/Midge*.cs
      - test/Pants.Tests/MidgeContractManifest.json
      - test/Pants.Tests/Pants.Tests.csproj
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Compatibility fixture refresh / ubuntu-latest / Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Pants
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out pinned Midge
        uses: actions/checkout@v7
        with:
          repository: cntryl/midge
          ref: c5ffc2d3284c76b6f7cd03444a5b0a38ae8bbc33
          path: .compat/midge
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0

      - name: Restore locked dependencies
        run: |
          dotnet restore eng/compat/Pants.CompatibilityHarness.Tests/Pants.CompatibilityHarness.Tests.csproj --locked-mode
          dotnet restore test/Pants.Tests/Pants.Tests.csproj --locked-mode

      - name: Verify compatibility harness formatting
        run: |
          dotnet format eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj --verify-no-changes --no-restore
          dotnet format eng/compat/Pants.CompatibilityHarness.Tests/Pants.CompatibilityHarness.Tests.csproj --verify-no-changes --no-restore

      - name: Build refresh harness tests
        run: >-
          dotnet build
          eng/compat/Pants.CompatibilityHarness.Tests/Pants.CompatibilityHarness.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test refresh transaction boundaries
        run: >-
          dotnet test
          eng/compat/Pants.CompatibilityHarness.Tests/Pants.CompatibilityHarness.Tests.csproj
          --configuration Release
          --no-build

      - name: Check committed baseline against pinned Midge
        run: >-
          dotnet run
          --project eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --configuration Release
          --no-build
          --
          refresh
          --check
          --midge
          ${{ github.workspace }}/.compat/midge

      - name: Regenerate disposable semantic fixtures
        run: >-
          dotnet run
          --project eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --configuration Release
          --no-build
          --
          refresh
          --midge
          ${{ github.workspace }}/.compat/midge

      - name: Build regenerated fixture tests
        run: >-
          dotnet build
          test/Pants.Tests/Pants.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test regenerated fixture contracts
        run: >-
          dotnet test
          test/Pants.Tests/Pants.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~CompatibilityFixtureMetadataTests|FullyQualifiedName~MidgeCompatibilityFixtureTests|FullyQualifiedName~MidgeWireGoldenTests|FullyQualifiedName~MidgeStorageGoldenTests|FullyQualifiedName~MidgeContractManifestTests"

  qualify:
    name: Compatibility / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out Pants
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out pinned Midge
        uses: actions/checkout@v7
        with:
          repository: cntryl/midge
          ref: c5ffc2d3284c76b6f7cd03444a5b0a38ae8bbc33
          path: .compat/midge
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Restore locked harness dependencies
        run: >-
          dotnet restore
          eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --locked-mode

      - name: Verify compatibility harness formatting
        run: >-
          dotnet format
          eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --verify-no-changes
          --no-restore

      - name: Build compatibility harness
        run: >-
          dotnet build
          eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --configuration ${{ matrix.configuration }}
          --no-restore

      - name: Run bidirectional compatibility qualification
        run: >-
          dotnet run
          --project eng/compat/Pants.CompatibilityHarness/Pants.CompatibilityHarness.csproj
          --configuration ${{ matrix.configuration }}
          --no-build
          --
          qualify
          --midge
          ${{ github.workspace }}/.compat/midge
