name: Publish

on:
  workflow_dispatch:
    inputs:
      packages-run-id:
        description: Successful Packages run containing the validated internal release.
        required: true
        type: string

permissions: {}

concurrency:
  group: nuget-org-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NuGet.org
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget.org
    permissions:
      actions: read
      id-token: write
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify internal Packages run
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.packages-run-id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -er '
            select(.path == ".github/workflows/packages.yml" and .head_branch == "main"
                   and .event == "workflow_dispatch" and .conclusion == "success") | .run_attempt')"
          echo "artifact=release-packages-$attempt" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packages-run-id }}
          name: ${{ steps.packages.outputs.artifact }}
          path: artifacts/packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Check public dependency availability
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as xml
          from zipfile import ZipFile

          packages = sorted(Path("artifacts/packages").glob("*.nupkg"))
          if not packages:
              raise SystemExit("The internal run did not provide NuGet packages.")

          probe = Path(os.environ["RUNNER_TEMP"]) / "nuget-probe"
          probe.mkdir()
          project = xml.Element("Project", Sdk="Microsoft.NET.Sdk")
          properties = xml.SubElement(project, "PropertyGroup")
          xml.SubElement(properties, "TargetFramework").text = "net11.0"
          references = xml.SubElement(project, "ItemGroup")
          for package in packages:
              with ZipFile(package) as archive:
                  nuspec, = (name for name in archive.namelist() if name.endswith(".nuspec"))
                  metadata = xml.fromstring(archive.read(nuspec)).find("{*}metadata")
              xml.SubElement(references, "PackageReference", Include=metadata.findtext("{*}id"),
                             Version=f"[{metadata.findtext('{*}version')}]")
          xml.ElementTree(project).write(probe / "Probe.csproj")
          PY
          dotnet restore "$RUNNER_TEMP/nuget-probe/Probe.csproj" \
            --source "$PWD/artifacts/packages" --source "$NUGET_SOURCE" \
            --packages "$RUNNER_TEMP/nuget-preflight" --no-http-cache

      - name: Log in to NuGet.org
        uses: NuGet/login@v1.2.0
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish validated packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Verify public package restore
        run: |
          for attempt in {1..10}; do
            if dotnet restore "$RUNNER_TEMP/nuget-probe/Probe.csproj" \
              --source "$NUGET_SOURCE" --packages "$RUNNER_TEMP/nuget-public" --no-http-cache --force; then
              exit 0
            fi
            sleep 15
          done
          exit 1
