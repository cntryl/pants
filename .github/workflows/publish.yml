name: Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pants-github-packages-publish
  cancel-in-progress: false

jobs:
  authorize:
    name: Require main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error title=Invalid release ref::Publish must run from refs/heads/main; got $REF"
            exit 1
          fi

  version:
    needs: authorize
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read

  publish:
    name: Publish NuGet packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.semver }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate package version
        shell: bash
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^1\.0\.[0-9]+$ ]]; then
            echo "::error title=Invalid package version::Expected 1.0.x, got $PACKAGE_VERSION"
            exit 1
          fi

      - name: Restore locked dependencies
        run: dotnet restore Pants.slnx --locked-mode

      - name: Pack NuGet packages
        shell: bash
        run: |
          dotnet pack src/Pants/Pants.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/packages \
            -p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Pants.DependencyInjection/Pants.DependencyInjection.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/packages \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package set
        shell: bash
        run: |
          test -f "artifacts/packages/Cntryl.Pants.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/packages/Cntryl.Pants.DependencyInjection.${PACKAGE_VERSION}.nupkg"
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' -type f | wc -l)" -eq 2

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/packages/Cntryl.Pants.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_AUTH_TOKEN" \
            --source "$PACKAGE_SOURCE" \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Cntryl.Pants.DependencyInjection.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_AUTH_TOKEN" \
            --source "$PACKAGE_SOURCE" \
            --skip-duplicate

  tag:
    name: Tag published version
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.semver }}
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag if missing
        id: tag
        shell: bash
        run: |
          tag="v${PACKAGE_VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error title=Tag conflict::$tag points to $tag_commit; expected $GITHUB_SHA"
              exit 1
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag" "$GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push tag to origin
        if: steps.tag.outputs.created == 'true'
        run: git push origin "refs/tags/${{ steps.tag.outputs.tag }}"
