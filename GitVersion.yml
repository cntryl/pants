# Pants keeps a stable 1.0 assembly identity while 2.x packages advance on main.
mode: ContinuousDeployment
next-version: 2.0.0

branches:
  main:
    regex: ^(?<BranchName>master|main)$
    increment: Patch
    is-mainline: true
  develop:
    regex: ^(?<BranchName>dev(elop)?(ment)?)$
    label: "alpha"
  feature:
    regex: ^features?[/-](?<BranchName>.+)
    label: "{BranchName}"
  pull-request:
    regex: ^(pull-requests|pull|pr)[/-](?<BranchName>.+)
    label: "{BranchName}"
  unknown:
    regex: (?<BranchName>.+)
    label: "{BranchName}"
